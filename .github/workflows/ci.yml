name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/tasks_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/tasks_test
      ALLOW_TEST_DB_RESET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply test database migrations
        run: alembic upgrade head && alembic check
      - name: Test with real PostgreSQL
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Test through Docker Compose
        run: docker compose --profile test run --build --rm tests
      - name: Start app and migrations through Docker Compose
        run: |
          docker compose up --build -d --wait app
          curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null
          test "$(docker compose exec -T app id -u)" = "10001"
      - name: Docker Compose logs
        if: always()
        run: docker compose --profile test logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose --profile test down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore

  build:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check Docker Hub credentials
        shell: bash
        run: |
          missing=0
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo '::error::Repository secret DOCKERHUB_USERNAME is missing or empty.'
            missing=1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Repository secret DOCKERHUB_TOKEN is missing or empty.'
            missing=1
          fi
          exit "$missing"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:latest"
            echo "$image:sha-$GITHUB_SHA"
            echo "$DOCKERHUB_USERNAME/fastapi-task-manager:latest"
            echo "$DOCKERHUB_USERNAME/fastapi-task-manager:sha-$GITHUB_SHA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publication summary
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Published GHCR image: ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Published Docker Hub image: $DOCKERHUB_USERNAME/fastapi-task-manager:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
